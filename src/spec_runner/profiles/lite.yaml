profile: lite
stages:
  - name: requirements
    template: requirements.template.md
    marker_prefix: SPEC_REQUIREMENTS
    validator: requirements
    upstream: []
    prompt_text: |-
      Generate a requirements document based on the project description below. Use [REQ-001], [REQ-002], etc. for each requirement. When done, output the requirements between markers:
      SPEC_REQUIREMENTS_READY
      <your requirements>
      SPEC_REQUIREMENTS_END
  - name: design
    template: design.template.md
    marker_prefix: SPEC_DESIGN
    validator: design
    upstream: [requirements]
    prompt_text: |-
      Generate a design document based on the requirements below. Use [DESIGN-001], [DESIGN-002], etc. and trace back to requirements with [REQ-XXX]. When done, output the design between markers:
      SPEC_DESIGN_READY
      <your design>
      SPEC_DESIGN_END
  - name: tasks
    template: tasks.template.md
    marker_prefix: SPEC_TASKS
    validator: tasks
    upstream: [design]
    prompt_text: |-
      Generate a tasks document based on the requirements and design below. Use TASK-001, TASK-002, etc. with priorities (P0-P3), estimates, checklists, dependencies, and traceability refs to [REQ-XXX] and [DESIGN-XXX].

      Every task must have exactly this shape — the runner parses it literally and refuses a spec it cannot read:

      ### TASK-001: <title>
      🔴 P0 | ⬜ TODO | Est: 2d

      **Checklist:**
      - [ ] <step>

      **Traces to:** [REQ-001], [DESIGN-001]
      **Depends on:** [TASK-000]
      **Blocks:** [TASK-002]

      The line under the header carries priority, then the status word (always ⬜ TODO for a new task), then the estimate — nothing else. No bold markup anywhere on it (`**P0**` is not recognized), and Traces to / Depends on / Blocks each go on their own line, never appended to it. Use `—` for an empty Depends on / Blocks.

      When done, output the tasks between markers:
      SPEC_TASKS_READY
      <your tasks>
      SPEC_TASKS_END
