name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0

      # The second enforcement point for release hygiene, and the fail-closed
      # one: `changelog-links` already runs on every pull request, but a PR
      # check is advice — the tag is the moment the artifact goes out, and it
      # is the moment the links must be right. Deliberately the SAME script
      # rather than a second validator, because two implementations of one rule
      # are how the rule ends up meaning two things.
      #
      # `--tag` adds what only makes sense here: the tag agrees with the
      # pyproject version (this replaces the inline shell that used to check
      # it), and the version has a CHANGELOG section — which is what the GitHub
      # Release notes are written from, so publishing without one ships blind.
      #
      # `publish` needs `build`, so a failure here means nothing reaches PyPI.
      - name: Release hygiene (tag, version, CHANGELOG links)
        run: python3 scripts/check_changelog_links.py --tag "$GITHUB_REF_NAME"

      - run: uv build
      - run: uv run --with twine twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/spec-runner/
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2: release/v1 is a mutable ref on the privileged publish path (R-2 baseline 2026-08-25, owner decision 2026-08-27)
        with:
          # Idempotent: don't fail if the version is already on PyPI (e.g. a
          # re-run, or a tag pushed after a manual twine upload).
          skip-existing: true
